
name: Build Nintendo DS ROM

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: - name: Install Nintendo DS tools
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm nds-dev
        run: |
          pacman -Sy --noconfirm
          pacman -S --noconfirm nds-dev

      - name: Configure build
        run: |
          cat > Makefile <<'EOF'
          export TARGET := pixel_quest
          export BUILD := build
          export SOURCES := source
          export DATA :=
          export GRAPHICS :=
          export INCLUDES :=
          export LIBS := -lnds9
          include $(DEVKITPRO)/libnds/Makefile
          EOF

      - name: Compile ROM
        run: make

      - name: Upload NDS file
        uses: actions/upload-artifact@v4
        with:
          name: pixel-quest-nds
          path: pixel_quest.nds
          if-no-files-found: error
